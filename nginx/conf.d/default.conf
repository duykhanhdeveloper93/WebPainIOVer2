upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:80;
}

# HTTP (dùng cho certbot + fallback)
server {
    listen 80;
    server_name nuocngavidai.duckdns.org www.nuocngavidai.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend;
    }

    location /api/ {
        proxy_pass http://backend;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        return 200 'OK';
    }
}

# HTTPS (chỉ hoạt động khi có cert)
server {
    listen 443 ssl http2;
    server_name nuocngavidai.duckdns.org www.nuocngavidai.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/nuocngavidai.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuocngavidai.duckdns.org/privkey.pem;

    gzip on;

    location / {
        proxy_pass http://frontend;
    }

    location /api/ {
        proxy_pass http://backend;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        return 200 'OK';
    }
}