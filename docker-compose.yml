services:

  mysql:
    image: mysql:8.0
    container_name: paintco_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass2024
      MYSQL_DATABASE: paintco_db
      MYSQL_USER: paintco
      MYSQL_PASSWORD: paintco123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "paintco", "--password=paintco123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - paintco_net

  backend:
    build:
      context: ./backend
    container_name: paintco_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: paintco
      DB_PASSWORD: paintco123
      DB_DATABASE: paintco_db
      JWT_SECRET: change-me
      JWT_EXPIRES: 7d
      FRONTEND_URL: https://nuocngavidai.duckdns.org
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - paintco_net

  frontend:
    build:
      context: ./frontend
    container_name: paintco_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - paintco_net

  nginx:
    image: nginx:1.25-alpine
    container_name: paintco_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - paintco_net

  # 👉 CHẠY 1 LẦN (SSL INIT)
  init-cert:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "
      echo '>>> INIT SSL';
      certbot certonly --webroot -w /var/www/certbot \
      -d nuocngavidai.duckdns.org \
      --email duykhanhdeveloper93@gmail.com \
      --agree-tos --no-eff-email \
      --non-interactive || true;
      echo '>>> DONE SSL';
      "
    depends_on:
      - nginx
    networks:
      - paintco_net

  # 👉 AUTO RENEW SSL
  certbot:
    image: certbot/certbot:latest
    container_name: paintco_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_certs:/etc/letsencrypt:rw
    entrypoint: >
      /bin/sh -c "
      while true; do
        echo '>>> Renew SSL';
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h;
      done"
    networks:
      - paintco_net

volumes:
  mysql_data:
  uploads_data:
  certbot_www:
  certbot_certs:

networks:
  paintco_net:
    driver: bridge